<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Parameter</title>
<style>
body{font-family:Segoe UI;margin:0;background:linear-gradient(to right,#1d4350,#a43931);display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{background:white;padding:30px;width:450px;max-width:94%;border-radius:15px;text-align:center;margin:15px 0}
button{width:45%;padding:15px;margin:8px;border:none;border-radius:10px;background:#0984e3;color:white;cursor:pointer;font-size:15px}
button:hover{background:#0652DD}
button.active{background:#0652DD;outline:3px solid #74b9ff}
button.full{width:100%;margin:10px 0;background:#e17055}
button.full:hover{background:#d63031}
.next{margin-top:20px;background:#00b894}
#inputBox{display:none;margin-top:15px;text-align:left}
#inputBox label{display:block;font-size:14px;color:#444;margin:10px 0 4px}
#inputBox input{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.info{font-size:14px;color:#555;margin:8px 0;line-height:1.5}
#result{display:none;margin-top:15px;padding:14px;border-radius:10px;font-size:15px;text-align:left;line-height:1.5}
#result.normal{background:#e6f9f3;color:#00785c;border:1px solid #00b894}
#result.warn{background:#fff4e0;color:#a35a00;border:1px solid #fdcb6e}
#result.danger{background:#ffeaea;color:#b71c1c;border:1px solid #d63031}
#result a{color:#b71c1c;font-weight:bold}
.note{font-size:12px;color:#777;margin-top:12px}
</style>
</head>
<body>
<div class="container">
<h2>Select Parameter</h2>
<div class="menu">
<button onclick="selectParam('hr',this)">❤️ Heart Rate</button>
<button onclick="selectParam('steps',this)">👟 Steps (Walk Test)</button>
<button onclick="selectParam('sleep',this)">😴 Sleep</button>
<button onclick="selectParam('react',this)">🧠 Reaction Time</button>
<button onclick="selectParam('chair',this)">🪑 Chair Stand</button>
</div>

<div id="inputBox"><div id="fields"></div></div>
<div id="result"></div>

<br>
<button class="next" onclick="goNext()">Next</button>
<p class="note">For awareness only. This is not a medical diagnosis.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const titles={hr:"Heart Rate",steps:"Walking Test (Steps)",sleep:"Sleep Duration",react:"Reaction Time",chair:"Chair Stand Test"};
let currentParam=null,lastResult=null,stopFn=null;
let rState='idle',rT=0,rTimer=null,rTimes=[];

const panels={
hr:`<p class="info">Cover the back camera and flash fully with your fingertip. Press lightly and keep still for 30 seconds. (Needs a phone and https.)</p>
<button class="full" onclick="startHR()">📷 Start Measuring</button><p class="info" id="hrMsg"></p>
<video id="vid" playsinline muted style="display:none"></video><canvas id="cv" width="40" height="40" style="display:none"></canvas>
<label>Or type heart rate manually (bpm)</label><input type="number" id="bpm" placeholder="e.g. 72">
<button class="full" onclick="manualHR()">Check</button>`,
steps:`<p class="info">Hold the phone in your hand or pocket and walk normally for 60 seconds. The phone counts your steps.</p>
<button class="full" onclick="startWalk()">🚶 Start Walking Test</button><p class="info" id="walkMsg"></p>`,
sleep:`<p class="info" id="sleepInfo"></p>
<button onclick="sleepStart()">😴 Going to Sleep</button><button onclick="sleepWake()">☀️ I Woke Up</button>
<label>Or type hours slept last night</label><input type="number" step="any" id="slp" placeholder="e.g. 7">
<button class="full" onclick="manualSleep()">Check</button>`,
react:`<p class="info">Tap the box to start. Wait for it to turn GREEN, then tap as fast as you can. 3 rounds.</p>
<div id="rbox" onclick="rTap()" style="height:150px;border-radius:12px;background:#636e72;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;user-select:none;text-align:center">Tap to Start</div>
<p class="info" id="rmsg"></p>`,
chair:`<p class="info">Sit on a chair with arms crossed. Stand up fully and sit down again as many times as you can in 30 seconds. A helper taps the big button each time you stand up.</p>
<button class="full" onclick="startChair()">▶ Start 30 sec Test</button>
<button id="cbtn" class="full" style="font-size:26px;padding:28px;display:none;background:#0984e3" onclick="cTap()"></button>
<p class="info" id="cmsg"></p>`
};

function selectParam(p,btn){
  if(stopFn){stopFn();stopFn=null;}
  clearTimeout(rTimer);rState='idle';rTimes=[];
  currentParam=p;lastResult=null;
  document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  $("fields").innerHTML=panels[p];
  $("inputBox").style.display="block";
  $("result").style.display="none";
  if(p==="sleep")sleepInfo();
}

/* Show result box + alert if not normal */
function showResult(status,level,message){
  const box=$("result");
  box.className=level;box.style.display="block";
  box.innerHTML="<b>"+status+"</b><br>"+message+(level==="danger"?'<br><a href="emergency.html">🚨 Go to Emergency Help</a>':"");
  lastResult={parameter:titles[currentParam],status:status,message:message,level:level};
  localStorage.setItem("lastHealthResult",JSON.stringify(lastResult));
  if(level!=="normal"){
    alert((level==="danger"?"🚨 ":"⚠️ ")+titles[currentParam]+": "+status+"\n\n"+message);
  }
}

/* ---------- 1. HEART RATE (camera) ---------- */
async function startHR(){
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:320},height:{ideal:240}}});}
  catch(e){alert("Camera not available. Allow camera permission (page must be https) or type the value manually.");return;}
  const track=stream.getVideoTracks()[0];
  try{await track.applyConstraints({advanced:[{torch:true}]});}catch(e){}
  const v=$("vid");v.srcObject=stream;await v.play();
  const c=$("cv").getContext("2d",{willReadFrequently:true});
  const data=[],t0=performance.now(),DUR=30000,msg=$("hrMsg");
  const timer=setInterval(()=>{
    const t=performance.now()-t0;
    c.drawImage(v,0,0,40,40);
    const px=c.getImageData(0,0,40,40).data;let r=0,g=0;
    for(let i=0;i<px.length;i+=4){r+=px[i];g+=px[i+1];}
    r/=1600;g/=1600;
    if(r>80&&r>g*2){data.push([t,r]);msg.textContent="Measuring... "+Math.ceil((DUR-t)/1000)+"s. Keep finger still.";}
    else msg.textContent="Finger not detected. Cover the camera and flash fully.";
    if(t>=DUR)finish();
  },50);
  function stop(){clearInterval(timer);stream.getTracks().forEach(x=>x.stop());}
  stopFn=stop;
  function finish(){
    stop();stopFn=null;
    const bpm=calcBPM(data);
    if(!bpm){msg.textContent="";alert("Could not read the pulse. Try again with your finger covering the camera and flash.");return;}
    $("bpm").value=bpm;msg.textContent="Measured: "+bpm+" bpm";
    evalHR(bpm);
  }
}
function calcBPM(d){
  if(d.length<150)return 0;
  const t=d.map(x=>x[0]),v=d.map(x=>x[1]),n=v.length,w=10;
  const s=v.map((_,i)=>{let a=0,k=0;for(let j=Math.max(0,i-w);j<=Math.min(n-1,i+w);j++){a+=v[j];k++;}return v[i]-a/k;});
  const m=s.map((_,i)=>(s[Math.max(0,i-1)]+s[i]+s[Math.min(n-1,i+1)])/3);
  const sd=Math.sqrt(s.reduce((a,x)=>a+x*x,0)/n);
  const iv=[];let last=-1e9;
  for(let i=1;i<n-1;i++){
    if(m[i]>m[i-1]&&m[i]>=m[i+1]&&m[i]>0.3*sd&&t[i]-last>=400){if(last>0)iv.push(t[i]-last);last=t[i];}
  }
  if(iv.length<8)return 0;
  iv.sort((a,b)=>a-b);
  const bpm=Math.round(60000/iv[Math.floor(iv.length/2)]);
  return(bpm>=40&&bpm<=190)?bpm:0;
}
function manualHR(){const h=parseFloat($("bpm").value);if(isNaN(h)||h<=0){alert("Please enter heart rate.");return;}evalHR(h);}
function evalHR(h){
  if(h>100)showResult("High ("+h+" bpm)","danger","Resting heart rate is above 100 bpm. Please rest and consult a doctor.");
  else if(h<60)showResult("Low ("+h+" bpm)","warn","Heart rate is below 60 bpm. Consult a doctor if you feel weak or dizzy.");
  else showResult("Normal ("+h+" bpm)","normal","Normal resting heart rate is 60 to 100 bpm.");
}

/* ---------- 2. STEPS (1-minute walk test with phone sensor) ---------- */
async function startWalk(){
  if(!window.DeviceMotionEvent){alert("Motion sensor not found. Please open this page on a phone.");return;}
  if(typeof DeviceMotionEvent.requestPermission==="function"){
    try{if(await DeviceMotionEvent.requestPermission()!=="granted")return;}catch(e){return;}
  }
  let steps=0,base=9.8,last=0,got=false;
  const t0=Date.now(),DUR=60000,msg=$("walkMsg");
  function h(e){
    const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
    got=true;const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
    base=base*0.9+m*0.1;const now=Date.now();
    if(m-base>1.2&&now-last>300){steps++;last=now;}
  }
  window.addEventListener("devicemotion",h);
  const tm=setInterval(()=>{
    const left=Math.ceil((DUR-(Date.now()-t0))/1000);
    msg.textContent="Walking... "+Math.max(left,0)+"s left | Steps: "+steps;
    if(left<=0){stop();stopFn=null;if(!got){alert("No motion data received. Use a phone with a motion sensor.");return;}evalSteps(steps);}
  },500);
  function stop(){clearInterval(tm);window.removeEventListener("devicemotion",h);}
  stopFn=stop;
}
function evalSteps(s){
  if(s<40)showResult("Very slow walking ("+s+" steps/min)","danger","Walking pace is very low. Please consult a doctor and take care while walking.");
  else if(s<80)showResult("Slow walking ("+s+" steps/min)","warn","Pace is below the healthy range. Try to walk a little every day.");
  else showResult("Good ("+s+" steps/min)","normal","Your walking pace is healthy. Keep it up!");
}

/* ---------- 3. SLEEP ---------- */
function sleepInfo(){
  const s=localStorage.getItem("sleepStart");
  $("sleepInfo").textContent=s?"Sleep started at "+new Date(+s).toLocaleTimeString()+". Press 'I Woke Up' in the morning.":"Press 'Going to Sleep' when you go to bed.";
}
function sleepStart(){localStorage.setItem("sleepStart",Date.now());sleepInfo();alert("Good night! 😴 Come back and press 'I Woke Up' in the morning.");}
function sleepWake(){
  const s=localStorage.getItem("sleepStart");
  if(!s){alert("Please press 'Going to Sleep' first.");return;}
  const hrs=(Date.now()-s)/3600000;localStorage.removeItem("sleepStart");sleepInfo();
  if(hrs>24){alert("Sleep time looks wrong. Please type the hours manually.");return;}
  evalSleep(Math.round(hrs*10)/10);
}
function manualSleep(){const h=parseFloat($("slp").value);if(isNaN(h)||h<=0||h>24){alert("Please enter hours between 1 and 24.");return;}evalSleep(h);}
function evalSleep(h){
  if(h<5)showResult("Very little sleep ("+h+" hrs)","danger","Less than 5 hours of sleep is not healthy. Please consult a doctor if this continues.");
  else if(h<7)showResult("Less sleep ("+h+" hrs)","warn","Elderly people need 7 to 9 hours of sleep. Try to sleep a little more.");
  else if(h<=9)showResult("Normal ("+h+" hrs)","normal","Good sleep! 7 to 9 hours is the healthy range.");
  else showResult("Too much sleep ("+h+" hrs)","warn","More than 9 hours of sleep. Consult a doctor if you feel tired all day.");
}

/* ---------- 4. REACTION TIME ---------- */
function rTap(){
  const b=$("rbox");
  if(rState==="idle"){
    rState="wait";b.style.background="#d63031";b.textContent="Wait for green...";
    rTimer=setTimeout(()=>{rState="go";rT=performance.now();b.style.background="#00b894";b.textContent="TAP NOW!";},2000+Math.random()*3000);
  }else if(rState==="wait"){
    clearTimeout(rTimer);rState="idle";b.style.background="#636e72";b.textContent="Too early! Tap to retry";
  }else{
    const ms=Math.round(performance.now()-rT);rTimes.push(ms);rState="idle";b.style.background="#636e72";
    $("rmsg").textContent="Round "+rTimes.length+"/3: "+ms+" ms";
    if(rTimes.length<3)b.textContent="Tap for next round";
    else{const avg=Math.round(rTimes.reduce((a,x)=>a+x,0)/3);rTimes=[];b.textContent="Tap to test again";evalReact(avg);}
  }
}
function evalReact(ms){
  if(ms>900)showResult("Very slow ("+ms+" ms)","danger","Reaction time is much slower than normal. Please consult a doctor.");
  else if(ms>600)showResult("Slow ("+ms+" ms)","warn","Reaction time is slower than normal. Take care while walking and recheck later.");
  else showResult("Normal ("+ms+" ms)","normal","Your reaction time is good.");
}

/* ---------- 5. CHAIR STAND TEST (30 sec) ---------- */
function startChair(){
  let count=0,left=30;const b=$("cbtn"),msg=$("cmsg");
  window.cTap=()=>{count++;b.textContent="Stood up! ("+count+")";};
  b.style.display="block";b.textContent="Stood up! (0)";msg.textContent="Time left: 30s";
  const tm=setInterval(()=>{
    left--;msg.textContent="Time left: "+left+"s";
    if(left<=0){stop();stopFn=null;b.style.display="none";msg.textContent="Total stands in 30 sec: "+count;evalChair(count);}
  },1000);
  function stop(){clearInterval(tm);}
  stopFn=stop;
}
function evalChair(c){
  if(c<8)showResult("Weak legs ("+c+" stands)","danger","Fewer than 8 stands in 30 seconds shows high fall risk. Please consult a doctor.");
  else if(c<12)showResult("Below average ("+c+" stands)","warn","Leg strength is a little low. Light daily exercise can help. Be careful of falls.");
  else showResult("Good ("+c+" stands)","normal","Your leg strength is good.");
}

/* Next button */
function goNext(){
  if(!lastResult){alert("Please select a parameter and complete the check first.");return;}
  localStorage.setItem("lastHealthResult",JSON.stringify(lastResult));
  window.location.href="result.html";
}
</script>
</body>
</html>
