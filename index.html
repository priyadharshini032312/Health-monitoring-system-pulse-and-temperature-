<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalCare Login</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    linear-gradient(110deg, rgba(4,19,29,.88), rgba(7,45,61,.65)),
    url("ui.jpeg") center/cover fixed;
}

header {
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  background: rgba(20,35,40,.72);
}

.brand { font-size: 25px; font-weight: bold; color: #00d6b0; }

nav { display: flex; gap: 20px; flex-wrap: wrap; }
nav a, .links a { color: white; }

main {
  width: min(650px, 100%);
  margin: 25px auto;
  padding: 16px;
  text-align: center;
}

h1 { font-size: 42px; margin: 12px 0; }
.subtitle { font-size: 19px; line-height: 1.5; }

.panel {
  max-width: 430px;
  margin: 20px auto;
  padding: 24px;
  border-radius: 15px;
  background: rgba(255,255,255,.17);
  box-shadow: 0 8px 25px #0003;
}

label { display: block; text-align: left; margin: 14px 0 7px; }

input, select, button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  font: inherit;
}

input, select { background: #fff; color: #17202a; border: 1px solid #ccc; }

button { cursor: pointer; margin-top: 12px; }

.primary {
  background: #00b99a;
  color: white;
  border: 0;
  font-weight: bold;
}

.secondary {
  background: #263b45;
  color: white;
  border: 1px solid white;
}

.hidden { display: none !important; }

.status { min-height: 24px; line-height: 1.5; }

.choice-row { display: flex; gap: 12px; }
.choice-row button { flex: 1; }

.links { line-height: 2; margin-top: 15px; }
.nav-row { display: flex; gap: 10px; }
.nav-row button { flex: 1; }

:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }

[dir="rtl"] { text-align: right; }

footer { text-align: center; padding: 18px; }

@media(max-width: 520px) {
  header { justify-content: center; }
  nav { justify-content: center; }
  h1 { font-size: 35px; }
  .choice-row { flex-direction: column; gap: 0; }
}
</style>
</head>

<body>
<header>
  <div class="brand">VitalCare</div>
  <nav>
    <a href="home.html" data-t="home">Home</a>
    <a href="about.html" data-t="about">About</a>
    <a href="contact.html" data-t="contact">Contact</a>
  </nav>
</header>

<main>
  <h1>VitalCare</h1>
  <p class="subtitle" data-t="subtitle">
    Smart healthcare monitoring for a healthier tomorrow
  </p>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <!-- LANGUAGE SELECTION -->
  <section class="panel" id="languagePage">
    <h2 data-t="chooseLanguage">Choose your language</h2>

    <label for="language" data-t="languageLabel">Select language</label>

    <select id="language">
      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
      <option value="hi">हिन्दी</option>
      <option value="te">తెలుగు</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="ml">മലയാളം</option>
      <option value="bn">বাংলা</option>
      <option value="mr">मराठी</option>
      <option value="gu">ગુજરાતી</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
      <option value="or">ଓଡ଼ିଆ</option>
      <option value="ur">اردو</option>
    </select>

    <button class="primary" id="languageNext" data-t="next">Next</button>
  </section>

  <!-- VISION QUESTION -->
  <section class="panel hidden" id="visionPage">
    <h2 data-t="visionQuestion">
      Are you blind or do you have difficulty seeing?
    </h2>

    <p data-t="sayYesNo">Please say Yes or No.</p>

    <div class="choice-row">
      <button class="primary" id="yesButton" data-t="yes">Yes</button>
      <button class="secondary" id="noButton" data-t="no">No</button>
    </div>

    <button class="secondary" id="repeatButton" data-t="repeat">
      Repeat question
    </button>

    <button class="secondary" id="backLanguage" data-t="back">
      Back
    </button>
  </section>

  <!-- LOGIN -->
  <section class="panel hidden" id="loginPage">
    <h2 data-t="loginTitle">Login to VitalCare</h2>

    <form id="loginForm">
      <label for="email" data-t="email">Email address</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password" data-t="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button type="button" class="secondary" id="speakEmail">
        <span data-t="emailVoice">Speak email address</span>
      </button>

      <label>
        <input type="checkbox" id="showPassword" style="width:auto">
        <span data-t="showPassword">Show password</span>
      </label>

      <p id="loginMessage" class="status" aria-live="polite"></p>

      <button type="submit" class="primary" data-t="loginButton">
        Login
      </button>
    </form>

    <div class="links">
      <a href="signup.html" data-t="signup">Create an account</a><br>
      <a href="forgot.html" data-t="forgot">Forgot password?</a>
    </div>

    <button class="secondary" id="backVision" data-t="back">Back</button>
  </section>
</main>

<footer>© VitalCare</footer>

const locales = {
 en:"en-IN", ta:"ta-IN", hi:"hi-IN", te:"te-IN",
 kn:"kn-IN", ml:"ml-IN", bn:"bn-IN", mr:"mr-IN",
 gu:"gu-IN", pa:"pa-IN", or:"or-IN", ur:"ur-PK"
};

const $ = id => document.getElementById(id);
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let lang = "en";
let voiceEnabled = false;
let recognition = null;
let recognitionTask = null;
let fontSize = 100;

function t(key) {
  return translations[lang]?.[key] || translations.en[key] || key;
}

function updateStatus(message) {
  $("status").textContent = message;
}

function speak(message, done) {
  if (!("speechSynthesis" in window)) {
    if (done) done();
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = locales[lang] || "en-IN";
  utterance.rate = 0.88;

  utterance.onend = () => {
    if (done) done();
  };

  speechSynthesis.speak(utterance);
}

function translatePage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";

  document.querySelectorAll("[data-t]").forEach(element => {
    const key = element.dataset.t;
    if (translations[lang]?.[key]) {
      element.textContent = translations[lang][key];
    }
  });
}

function showPage(page) {
  $("languagePage").classList.toggle("hidden", page !== "language");
  $("visionPage").classList.toggle("hidden", page !== "vision");
  $("loginPage").classList.toggle("hidden", page !== "login");

  if (page === "language") $("language").focus();
  if (page === "vision") $("yesButton").focus();
  if (page === "login") $("email").focus();
}

async function requestMicrophone() {
  if (!navigator.mediaDevices?.getUserMedia) return true;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(track => track.stop());
    return true;
  } catch {
    updateStatus(t("micError"));
    speak(t("micError"));
    return false;
  }
}

function startRecognition(task) {
  if (!Recognition) {
    updateStatus(t("unsupported"));
    speak(t("unsupported"));
    return;
  }

  recognitionTask = task;

  try {
    recognition = new Recognition();
    recognition.lang = locales[lang] || "en-IN";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;

    recognition.onresult = event => {
      const spoken = event.results[0][0].transcript
        .toLowerCase().trim();

      const currentTask = recognitionTask;
      recognitionTask = null;

      if (currentTask === "vision") {
        processVisionAnswer(spoken);
      } else if (currentTask === "email") {
        processEmail(spoken);
      }
    };

    recognition.onerror = event => {
      recognitionTask = null;

      if (event.error === "not-allowed") {
        updateStatus(t("micError"));
        speak(t("micError"));
      } else if (task === "vision") {
        askVisionQuestion();
      } else if (task === "email") {
        updateStatus(t("emailError"));
        speak(t("emailError"));
      }
    };

    recognition.onend = () => {
      // No automatic endless restart; avoid repeated microphone prompts.
    };

    updateStatus("🎙");
    recognition.start();
  } catch {
    updateStatus(t("unsupported"));
  }
}

async function askAndListen(message, task) {
  const allowed = await requestMicrophone();
  if (!allowed) return;

  speak(message, () => startRecognition(task));
}

function startQuestion() {
  lang = $("language").value;
  translatePage();
  showPage("vision");

  askAndListen(
    t("visionQuestion") + " " + t("sayYesNo"),
    "vision"
  );
}

function askVisionQuestion() {
  askAndListen(
    t("questionAgain") + " " + t("visionQuestion"),
    "vision"
  );
}

function processVisionAnswer(answer) {
  const yesWords = [
    "yes", "yeah", "yep", "ஆம்", "ஆமாம்", "ஆமா",
    "అవును", "ಹೌದು", "അതെ", "हाँ", "हां", "জি",
    "হ্যাঁ", "होय", "હા", "ਹਾਂ", "ହଁ", "ہاں"
  ];

  const noWords = [
    "no", "nope", "இல்லை", "இல்ல", "కాదు",
    "ಇಲ್ಲ", "ഇല്ല", "नहीं", "नहि", "না", "नाही",
    "ના", "ਨਹੀਂ", "ନା", "نہیں"
  ];

  const normalized = answer.replace(/[.,!?]/g, "").trim();

  if (yesWords.some(word => normalized === word ||
      normalized.startsWith(word + " "))) {
    enableAccessibility();
  } else if (noWords.some(word => normalized === word ||
      normalized.startsWith(word + " "))) {
    disableAccessibility();
  } else {
    askVisionQuestion();
  }
}

function enableAccessibility() {
  voiceEnabled = true;
  localStorage.setItem("vc_voice", "on");
  localStorage.setItem("vc_visual_assistance", "yes");

  showPage("login");
  speak(t("emailPrompt"), () => startRecognition("email"));
}

function disableAccessibility() {
  voiceEnabled = false;
  localStorage.setItem("vc_voice", "off");
  localStorage.setItem("vc_visual_assistance", "no");

  if ("speechSynthesis" in window) speechSynthesis.cancel();
  showPage("login");
  updateStatus("");
}

function processEmail(spoken) {
  let email = spoken.toLowerCase().trim();

  email = email
    .replace(/\s+at\s+the\s+rate\s+/g, "@")
    .replace(/\s+at\s+/g, "@")
    .replace(/\s+dot\s+/g, ".")
    .replace(/\s+underscore\s+/g, "_")
    .replace(/\s+dash\s+/g, "-")
    .replace(/\s/g, "");

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    updateStatus(t("emailError"));
    speak(t("emailError"), () => startRecognition("email"));
    return;
  }

  $("email").value = email;
  updateStatus(t("emailDone"));
  speak(t("emailDone"));
  $("password").focus();
}

$("languageNext").addEventListener("click", startQuestion);

$("language").addEventListener("change", () => {
  lang = $("language").value;
  translatePage();
});

$("yesButton").addEventListener("click", enableAccessibility);
$("noButton").addEventListener("click", disableAccessibility);

$("repeatButton").addEventListener("click", askVisionQuestion);

$("backLanguage").addEventListener("click", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  showPage("language");
});

$("backVision").addEventListener("click", () => showPage("vision"));

$("speakEmail").addEventListener("click", async () => {
  await askAndListen(t("emailPrompt"), "email");
});

$("showPassword").addEventListener("change", () => {
  $("password").type = $("showPassword").checked ? "text" : "password";
});

$("loginForm").addEventListener("submit", event => {
  event.preventDefault();
  $("loginMessage").textContent = t("loginNotice");

  if (voiceEnabled) speak(t("loginNotice"));
});

/* Restore the user's language selection. */
const savedLanguage = localStorage.getItem("vc_lang");
if (savedLanguage && translations[savedLanguage]) {
  lang = savedLanguage;
  $("language").value = savedLanguage;
}

$("language").addEventListener("change", () => {
  localStorage.setItem("vc_lang", $("language").value);
});

translatePage();
showPage("language");
</script>
