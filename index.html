
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalCare - Login</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;color:white;
  min-height:100vh;
  background:linear-gradient(#071923b8,#092737bd),url("ui.jpeg");
  background-size:cover;background-position:center;background-attachment:fixed
}
header{
  min-height:70px;padding:16px 4%;
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;flex-wrap:wrap;background:#18272cbb
}
.brand{font-size:25px;font-weight:bold;color:#00d6b0}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{color:white;text-decoration:none}
nav a:hover{text-decoration:underline}
main{max-width:680px;margin:35px auto;padding:20px;text-align:center}
.access-buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 28px}
button,select,input{
  font:inherit;border-radius:9px;padding:12px;border:1px solid #c8d4dc
}
button{cursor:pointer}
.access-buttons button,.secondary{
  color:white;background:#202e37d9;border:1px solid #d3e0e5
}
h1{font-size:48px;margin:15px 0}
.subtitle{font-size:21px;line-height:1.5}
.panel{
  max-width:420px;margin:25px auto;padding:25px 28px;
  border-radius:17px;background:#ffffff30;
  backdrop-filter:blur(12px);box-shadow:0 8px 25px #0002
}
.panel h2{margin-top:0}
label{display:block;text-align:left;margin:14px 0 7px}
input,select{width:100%;background:#edf3ff;color:#17202a}
input:focus,select:focus,button:focus,a:focus{
  outline:3px solid #ffd166;outline-offset:3px
}
.primary{width:100%;margin-top:18px;background:#00b99a;color:white;border:0;font-weight:bold}
.primary:hover{background:#009e83}
.secondary{margin:5px}
.message{min-height:24px;color:#ffe3a6}
.links{line-height:2;margin-top:18px}
.hidden{display:none!important}
.choice-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.choice-row button{min-width:115px}
footer{text-align:center;padding:20px}
body.high-contrast{background:#000!important;color:#fff}
body.high-contrast .panel,body.high-contrast header{background:#000;border:2px solid white}
body.large-text{font-size:120%}
#voiceStatus{font-size:14px;min-height:20px}
@media(max-width:600px){
 header{justify-content:center;text-align:center}
 h1{font-size:38px}
 main{margin:15px auto;padding:12px}
 .panel{padding:22px 18px}
 .subtitle{font-size:18px}
}
</style>
</head>

<body>
<header>
  <div class="brand" id="brand">VitalCare</div>
  <nav aria-label="Main navigation">
    <a href="home.html" data-t="home">Home</a>
    <a href="about.html" data-t="about">About</a>
    <a href="contact.html" data-t="contact">Contact</a>
  </nav>
</header>

<main>
  <div class="access-buttons" aria-label="Accessibility options">
    <button type="button" id="readBtn" data-t="read">🔊 Read this page</button>
    <button type="button" id="smallerBtn" data-t="smaller">A− Smaller text</button>
    <button type="button" id="largerBtn" data-t="larger">A+ Larger text</button>
    <button type="button" id="contrastBtn" data-t="contrast">High contrast</button>
    <button type="button" id="voiceToggle" aria-pressed="false">🔈 Voice: OFF</button>
  </div>

  <h1>VitalCare</h1>
  <p class="subtitle" id="subtitle" data-t="subtitle">
    Smart healthcare monitoring for a healthier tomorrow
  </p>
  <p id="voiceStatus" role="status" aria-live="polite"></p>

  <!-- STEP 1: LANGUAGE -->
  <section class="panel" id="languageStep" aria-labelledby="languageTitle">
    <h2 id="languageTitle" data-t="chooseLanguage">Choose your language</h2>
    <label for="languageSelect" data-t="languageLabel">Select language</label>
    <select id="languageSelect">
      <option value="en">English</option>
      <option value="ta">தமிழ் (Tamil)</option>
      <option value="hi">हिन्दी (Hindi)</option>
      <option value="te">తెలుగు (Telugu)</option>
      <option value="kn">ಕನ್ನಡ (Kannada)</option>
      <option value="ml">മലയാളം (Malayalam)</option>
      <option value="bn">বাংলা (Bengali)</option>
      <option value="mr">मराठी (Marathi)</option>
      <option value="gu">ગુજરાતી (Gujarati)</option>
      <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
      <option value="or">ଓଡ଼ିଆ (Odia)</option>
      <option value="ur">اردو (Urdu)</option>
    </select>
    <button class="primary" id="languageNext" data-t="next">Next</button>
  </section>

  <!-- STEP 2: ACCESSIBILITY QUESTION -->
  <section class="panel hidden" id="accessStep" aria-labelledby="accessTitle">
    <h2 id="accessTitle" data-t="accessTitle">Do you have a visual impairment?</h2>
    <p id="accessDescription" data-t="accessDescription">
      We can enable voice guidance throughout VitalCare.
    </p>
    <div class="choice-row">
      <button class="primary" id="yesBtn" type="button" data-t="yes">Yes</button>
      <button class="secondary" id="noBtn" type="button" data-t="no">No</button>
    </div>
    <button class="secondary" id="accessBack" type="button" data-t="back">Back</button>
  </section>

  <!-- STEP 3: LOGIN -->
  <section class="panel hidden" id="loginStep" aria-labelledby="loginTitle">
    <h2 id="loginTitle" data-t="login">Login to VitalCare</h2>
    <form id="loginForm">
      <label for="email" data-t="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username"
             required aria-describedby="emailHelp">
      <p id="emailHelp" class="hidden" data-t="emailHelp">Enter your registered email.</p>

      <label for="password" data-t="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <label>
        <input id="showPassword" type="checkbox" style="width:auto">
        <span data-t="showPassword">Show password</span>
      </label>

      <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
      <button class="primary" type="submit" data-t="loginButton">Login</button>
    </form>

    <div class="links">
      <a href="signup.html" data-t="signup">Create an account</a><br>
      <a href="forgot.html" data-t="forgot">Forgot password?</a>
    </div>

    <button class="secondary" id="loginBack" type="button" data-t="back">Back</button>
  </section>
</main>

<footer>© VitalCare</footer>

const speechLocales = {
 en:"en-IN",ta:"ta-IN",hi:"hi-IN",te:"te-IN",kn:"kn-IN",ml:"ml-IN",
 bn:"bn-IN",mr:"mr-IN",gu:"gu-IN",pa:"pa-IN",or:"or-IN",ur:"ur-PK"
};

const $ = id => document.getElementById(id);
let lang = localStorage.getItem("vc_lang") || "en";
let voiceOn = localStorage.getItem("vc_voice") === "on";
let step = 1;

function tr(key){
 return (translations[lang] && translations[lang][key]) || translations.en[key] || key;
}
function speak(text){
 if(!voiceOn || !("speechSynthesis" in window)) return;
 window.speechSynthesis.cancel();
 const msg = new SpeechSynthesisUtterance(text);
 msg.lang = speechLocales[lang] || "en-IN";
 msg.rate = 0.9;
 window.speechSynthesis.speak(msg);
}
function setStatus(message){ $("voiceStatus").textContent = message; }

function applyLanguage(){
 document.documentElement.lang = lang;
 document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
 document.querySelectorAll("[data-t]").forEach(el=>{
   const key = el.getAttribute("data-t");
   if(translations[lang][key]) el.textContent = translations[lang][key];
 });
 $("voiceToggle").textContent = voiceOn ? tr("voiceOn") : tr("voiceOff");
 $("voiceToggle").setAttribute("aria-pressed", String(voiceOn));
 localStorage.setItem("vc_lang",lang);
 localStorage.setItem("vc_voice",voiceOn ? "on" : "off");
}

function showStep(number, shouldSpeak=true){
 step = number;
 $("languageStep").classList.toggle("hidden",number !== 1);
 $("accessStep").classList.toggle("hidden",number !== 2);
 $("loginStep").classList.toggle("hidden",number !== 3);
 if(number === 1) $("languageSelect").focus();
 if(number === 2) $("yesBtn").focus();
 if(number === 3) $("email").focus();
 if(shouldSpeak && voiceOn){
   if(number===1) speak(tr("chooseLanguage"));
   if(number===2) speak(tr("accessTitle") + " " + tr("accessDescription") + " " + tr("yes") + ". " + tr("no"));
   if(number===3) speak(tr("welcome") + " " + tr("emailPrompt"));
 }
}

$("languageSelect").value = lang;
$("languageSelect").addEventListener("change",()=>{
 lang = $("languageSelect").value;
 applyLanguage();
 speak(tr("languageChosen") + " " + $("languageSelect").selectedOptions[0].text);
});
$("languageNext").addEventListener("click",()=>{
 lang = $("languageSelect").value;
 applyLanguage();
 showStep(2);
});
$("accessBack").addEventListener("click",()=>showStep(1));
$("loginBack").addEventListener("click",()=>showStep(2));

function chooseAccessibility(answer){
 localStorage.setItem("vc_visual_assistance",answer);
 voiceOn = answer === "yes";
 localStorage.setItem("vc_voice",voiceOn ? "on" : "off");
 applyLanguage();
 showStep(3,false);
 if(voiceOn){
   setStatus(tr("voiceEnabled"));
   // Browsers may require a user gesture before speech can start.
   speak(tr("welcome") + " " + tr("voiceEnabled") + " " +
         tr("emailPrompt") + " " + tr("passwordPrompt") + " " + tr("loginPrompt"));
 }else{
   setStatus(tr("voiceDisabled"));
 }
}
$("yesBtn").addEventListener("click",()=>chooseAccessibility("yes"));
$("noBtn").addEventListener("click",()=>chooseAccessibility("no"));

$("voiceToggle").addEventListener("click",()=>{
 voiceOn = !voiceOn;
 localStorage.setItem("vc_voice",voiceOn ? "on" : "off");
 applyLanguage();
 if(voiceOn) speak(tr("welcome") + " " + tr("voiceEnabled"));
 else if("speechSynthesis" in window) window.speechSynthesis.cancel();
 setStatus(voiceOn ? tr("voiceEnabled") : tr("voiceDisabled"));
});

$("readBtn").addEventListener("click",()=>{
 if(!("speechSynthesis" in window)){
   setStatus("Speech playback is not supported in this browser.");
   return;
 }
 voiceOn = true;
 localStorage.setItem("vc_voice","on");
 applyLanguage();
 const currentPanel = step===1 ? $("languageStep") : step===2 ? $("accessStep") : $("loginStep");
 const textToRead = currentPanel.innerText;
 speak(textToRead);
});
$("smallerBtn").addEventListener("click",()=>document.body.classList.remove("large-text"));
$("largerBtn").addEventListener("click",()=>document.body.classList.add("large-text"));
$("contrastBtn").addEventListener("click",()=>document.body.classList.toggle("high-contrast"));

$("showPassword").addEventListener("change",()=>{
 $("password").type = $("showPassword").checked ? "text" : "password";
});

$("email").addEventListener("focus",()=>speak(tr("emailPrompt")));
$("password").addEventListener("focus",()=>speak(tr("passwordPrompt")));
$("loginForm").addEventListener("submit",event=>{
 event.preventDefault();
 // Connect this form to your real, secure backend authentication.
 // Do not store real passwords in localStorage.
 $("loginMessage").textContent = tr("loginError");
 speak(tr("loginError"));
});

applyLanguage();

// First visit: start at language selection.
// Returning visit: keep the selected language, but ask accessibility question
// again only if the user has not answered it before.
if(localStorage.getItem("vc_visual_assistance")){
  showStep(3,false);
  if(voiceOn) speak(tr("welcome") + " " + tr("emailPrompt"));
}else{
  showStep(1,false);
}
</script>
</body>
</html>
