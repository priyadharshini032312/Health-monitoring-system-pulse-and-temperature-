
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalCare Login</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;min-height:100vh;
  color:white;background:linear-gradient(120deg,#102b38,#087e83);
}
header{
  padding:18px 5%;display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;background:#102b38;
}
.logo{font-size:25px;font-weight:bold;color:#4ce0c1}
nav{display:flex;gap:18px}
nav a{color:white;text-decoration:none}
main{width:min(620px,94%);margin:25px auto;text-align:center}
h1{font-size:42px;margin-bottom:8px}
.panel{
  background:#ffffff1c;padding:25px;margin:20px auto;
  border-radius:15px;max-width:440px;text-align:left;
}
.panel h2{text-align:center}
label{display:block;margin:14px 0 6px}
input,select,button{
  width:100%;padding:12px;border-radius:8px;
  font-size:16px;margin:5px 0;
}
input,select{border:1px solid #ccc;background:white;color:#111}
button{cursor:pointer;border:0;font-weight:bold}
.primary{background:#00b99a;color:white}
.secondary{background:#edf5f5;color:#123}
.hidden{display:none!important}
.status{min-height:22px;line-height:1.5}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tools button{width:auto;background:#fff;color:#123}
.row{display:flex;gap:10px}
.row button{flex:1}
a:focus,button:focus,input:focus,select:focus{
  outline:3px solid #ffd166;outline-offset:2px
}
body.contrast{background:#000;color:#fff}
body.contrast .panel,body.contrast header{background:#000;border:2px solid white}
body.big{font-size:125%}
footer{text-align:center;padding:20px}
</style>
</head>

<body>
<header>
  <div class="logo">VitalCare</div>
  <nav aria-label="Main navigation">
    <a href="home.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <h1>VitalCare</h1>
  <p id="subtitle">Smart healthcare monitoring for a healthier tomorrow.</p>

  <div class="tools">
    <button id="readPage" type="button">🔊 Read page</button>
    <button id="fontDown" type="button">A−</button>
    <button id="fontUp" type="button">A+</button>
    <button id="contrast" type="button">Contrast</button>
    <button id="voiceToggle" type="button">Voice ON/OFF</button>
  </div>

  <p id="status" class="status" aria-live="polite"></p>

  <!-- STEP 1: LANGUAGE -->
  <section id="languageStep" class="panel">
    <h2 id="languageHeading">Choose your language</h2>
    <label for="language">Language</label>
    <select id="language">
      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
      <option value="hi">हिन्दी</option>
      <option value="te">తెలుగు</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="ml">മലയാളം</option>
      <option value="bn">বাংলা</option>
      <option value="mr">मराठी</option>
      <option value="gu">ગુજરાતી</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
      <option value="or">ଓଡ଼ିଆ</option>
      <option value="ur">اردو</option>
    </select>
    <button class="primary" id="nextLanguage" type="button">Next</button>
  </section>

  <!-- STEP 2: ACCESSIBILITY QUESTION -->
  <section id="accessStep" class="panel hidden">
    <h2 id="accessQuestion">Are you blind or do you have difficulty seeing?</h2>
    <p id="accessHint">Say Yes or No. You can also select a button.</p>
    <div class="row">
      <button class="primary" id="yesButton" type="button">Yes</button>
      <button class="secondary" id="noButton" type="button">No</button>
    </div>
    <button class="secondary" id="repeatButton" type="button">Repeat question</button>
    <button class="secondary" id="backLanguage" type="button">Back</button>
  </section>

  <!-- STEP 3: LOGIN -->
  <section id="loginStep" class="panel hidden">
    <h2 id="loginHeading">Login to VitalCare</h2>
    <form id="loginForm">
      <label for="email" id="emailLabel">Email address</label>
      <input id="email" type="email" autocomplete="username" required>
      <button class="secondary" id="emailVoice" type="button">🎙️ Speak email</button>

      <label for="password" id="passwordLabel">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <label>
        <input id="showPassword" type="checkbox" style="width:auto">
        Show password
      </label>
      <button class="secondary" id="passwordVoice" type="button">
        🎙️ Speak password (avoid in public)
      </button>

      <button class="primary" type="submit" id="loginButton">Login</button>
      <p id="loginMessage" aria-live="polite"></p>
    </form>

    <p><a href="signup.html" style="color:white">Create account</a></p>
    <p><a href="forgot.html" style="color:white">Forgot password?</a></p>
    <button class="secondary" id="backAccess" type="button">Back</button>
  </section>
</main>

<footer>© VitalCare</footer>

<script>
"use strict";

const $ = id => document.getElementById(id);

const languageNames = {
  en:"English",ta:"Tamil",hi:"Hindi",te:"Telugu",
  kn:"Kannada",ml:"Malayalam",bn:"Bengali",mr:"Marathi",
  gu:"Gujarati",pa:"Punjabi",or:"Odia",ur:"Urdu"
};

const locale = {
  en:"en-IN",ta:"ta-IN",hi:"hi-IN",te:"te-IN",
  kn:"kn-IN",ml:"ml-IN",bn:"bn-IN",mr:"mr-IN",
  gu:"gu-IN",pa:"pa-IN",or:"or-IN",ur:"ur-PK"
};

const text = {
 en:{
  subtitle:"Smart healthcare monitoring for a healthier tomorrow.",
  languageHeading:"Choose your language",next:"Next",
  question:"Are you blind or do you have difficulty seeing?",
  hint:"Say Yes or No. You can also select a button.",
  yes:"Yes",no:"No",repeat:"Repeat question",back:"Back",
  login:"Login to VitalCare",email:"Email address",password:"Password",
  show:"Show password",speakEmail:"🎙️ Speak email",
  speakPassword:"🎙️ Speak password (avoid in public)",loginButton:"Login",
  ask:"Please say your email address.",
  welcome:"Welcome to VitalCare.",
  voiceOn:"Voice assistance is on.",voiceOff:"Voice assistance is off.",
  retry:"I couldn't recognize that. Please try again.",
  denied:"Microphone permission denied. Allow microphone access in browser settings.",
  unsupported:"Voice recognition is not supported. Please use an updated Chrome browser."
 },
 ta:{
  subtitle:"Nalla aarokkiyathirkana smart health monitoring.",
  languageHeading:"Ungal mozhiya therndhedunga",next:"Aduthu",
  question:"Ungalukku paarvai kuraipaadu irukka?",
  hint:"Aam allathu illai nu voice-la sollunga.",
  yes:"Aam",no:"Illai",repeat:"Kelviyai meendum kelu",back:"Pinnal",
  login:"VitalCare Login",email:"Email mugavari",password:"Password",
  show:"Password kaattu",speakEmail:"🎙️ Email-ai sollunga",
  speakPassword:"🎙️ Password sollunga (public place-la vendam)",loginButton:"Login",
  ask:"Ungal email mugavariyai voice-la sollunga.",
  welcome:"VitalCare-ku varaverkirom.",
  voiceOn:"Voice assistance ON aagiyulladhu.",
  voiceOff:"Voice assistance OFF aagiyulladhu.",
  retry:"Puriyavillai. Meendum methuvaaga sollunga.",
  denied:"Microphone permission allow pannunga.",
  unsupported:"Indha browser-la voice recognition support illai. Updated Chrome use pannunga."
 },
 hi:{
  subtitle:"बेहतर स्वास्थ्य के लिए स्मार्ट निगरानी",
  languageHeading:"अपनी भाषा चुनें",next:"आगे",
  question:"क्या आपको देखने में कठिनाई होती है?",
  hint:"हाँ या नहीं बोलें।",yes:"हाँ",no:"नहीं",
  repeat:"फिर से पूछें",back:"वापस",login:"VitalCare लॉगिन",
  email:"ईमेल पता",password:"पासवर्ड",show:"पासवर्ड दिखाएँ",
  speakEmail:"🎙️ ईमेल बोलें",speakPassword:"🎙️ पासवर्ड बोलें",
  loginButton:"लॉगिन",ask:"अपना ईमेल पता बोलें।",
  welcome:"VitalCare में आपका स्वागत है।",
  voiceOn:"वॉइस सहायता चालू है।",voiceOff:"वॉइस सहायता बंद है।",
  retry:"फिर से बोलें।",denied:"माइक्रोफ़ोन अनुमति दें।",
  unsupported:"अपडेटेड Chrome इस्तेमाल करें।"
 }
};

// Other languages use English fallback until their complete translations
// are added. Speech recognition locale is still selected for each language.
let lang=localStorage.getItem("vc_lang")||"en";
let voiceEnabled=localStorage.getItem("vc_voice")==="on";
let currentStep=1;
let recognition=null;
let recognitionTask="";

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

function tr(key){
  return (text[lang] && text[lang][key]) || text.en[key] || key;
}

function say(message,after){
  if(!("speechSynthesis" in window)){
    if(after) after();
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(message);
  u.lang=locale[lang]||"en-IN";
  u.rate=.9;
  u.onend=()=>{if(after)after()};
  speechSynthesis.speak(u);
}

function applyLanguage(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ur"?"rtl":"ltr";
  $("subtitle").textContent=tr("subtitle");
  $("languageHeading").textContent=tr("languageHeading");
  $("nextLanguage").textContent=tr("next");
  $("accessQuestion").textContent=tr("question");
  $("accessHint").textContent=tr("hint");
  $("yesButton").textContent=tr("yes");
  $("noButton").textContent=tr("no");
  $("repeatButton").textContent=tr("repeat");
  $("backLanguage").textContent=tr("back");
  $("backAccess").textContent=tr("back");
  $("loginHeading").textContent=tr("login");
  $("emailLabel").textContent=tr("email");
  $("passwordLabel").textContent=tr("password");
  $("showPassword").nextSibling.textContent=" "+tr("show");
  $("emailVoice").textContent=tr("speakEmail");
  $("passwordVoice").textContent=tr("speakPassword");
  $("loginButton").textContent=tr("loginButton");
  $("voiceToggle").textContent=voiceEnabled?"🔊 "+tr("voiceOn"):"🔈 "+tr("voiceOff");
  localStorage.setItem("vc_lang",lang);
  localStorage.setItem("vc_voice",voiceEnabled?"on":"off");
}

function showStep(n){
  currentStep=n;
  $("languageStep").classList.toggle("hidden",n!==1);
  $("accessStep").classList.toggle("hidden",n!==2);
  $("loginStep").classList.toggle("hidden",n!==3);
  const focusId=n===1?"language":n===2?"yesButton":"email";
  $(focusId).focus();
}

function startListening(task){
  if(!SpeechRecognition){
    $("status").textContent=tr("unsupported");
    say(tr("unsupported"));
    return;
  }
  recognitionTask=task;
  if(!recognition){
    recognition=new SpeechRecognition();
    recognition.continuous=false;
    recognition.interimResults=false;
    recognition.maxAlternatives=1;
    recognition.onresult=e=>{
      const spoken=e.results[0][0].transcript.trim();
      $("status").textContent="Heard: "+spoken;
      const task=recognitionTask;
      recognitionTask="";
      if(task==="answer")handleYesNo(spoken);
      if(task==="email")handleEmail(spoken);
      if(task==="password")handlePassword(spoken);
    };
    recognition.onerror=e=>{
      $("status").textContent=e.error==="not-allowed"?tr("denied"):tr("retry");
      if(e.error==="not-allowed")say(tr("denied"));
    };
  }
  recognition.lang=locale[lang]||"en-IN";
  try{
    recognition.start();
    $("status").textContent="🎙️ Listening...";
  }catch(e){
    $("status").textContent="Microphone busy. Try again.";
  }
}

function askThenListen(message,task){
  if(!SpeechRecognition){say(message);$("status").textContent=tr("unsupported");return;}
  say(message,()=>startListening(task));
}

function handleYesNo(answer){
  const a=answer.toLowerCase();
  const yes=["yes","yeah","ஆம்","ஆமாம்","ஆமா","అవును","ಹೌದು","അതെ","हाँ","हां","হ্যাঁ","होय","હા","ਹਾਂ","ହଁ","ہاں"];
  const no=["no","nope","இல்லை","இல்ல","కాదు","ಇಲ್ಲ","ഇല്ല","नहीं","না","नाही","ના","ਨਹੀਂ","ନା","نہیں"];
  if(yes.some(w=>a.includes(w))){
    chooseAccess(true);
  }else if(no.some(w=>a.includes(w))){
    chooseAccess(false);
  }else{
    askThenListen(tr("retry")+" "+tr("yes")+" "+tr("no"),"answer");
  }
}

function chooseAccess(yes){
  voiceEnabled=yes;
  localStorage.setItem("vc_visual_assistance",yes?"yes":"no");
  applyLanguage();
  showStep(3);
  if(yes){
    say(tr("welcome")+" "+tr("ask"),()=>startListening("email"));
  }else{
    say(tr("voiceOff"));
  }
}

function handleEmail(raw){
  let email=raw.toLowerCase().trim();
  email=email.replace(/\s+at\s+/g,"@")
             .replace(/\s+dot\s+/g,".")
             .replace(/\s+underscore\s+/g,"_")
             .replace(/\s+/g,"");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    $("email").value=email;
    say(tr("retry")+" "+tr("ask"),()=>startListening("email"));
    return;
  }
  $("email").value=email;
  $("email").dispatchEvent(new Event("input",{bubbles:true}));
  $("status").textContent="Email entered.";
  say("Email entered. Please enter your password.");
  $("password").focus();
}

function handlePassword(raw){
  $("password").value=raw;
  $("password").dispatchEvent(new Event("input",{bubbles:true}));
  $("status").textContent="Password entered. It will not be read aloud.";
  say("Password entered.");
}

$("language").value=lang;
$("language").addEventListener("change",()=>{
  lang=$("language").value;
  applyLanguage();
});
$("nextLanguage").addEventListener("click",()=>{
  lang=$("language").value;
  applyLanguage();
  showStep(2);
  askThenListen(
    tr("question")+" "+tr("hint")+" "+tr("yes")+" "+tr("no"),
    "answer"
  );
});
$("yesButton").addEventListener("click",()=>chooseAccess(true));
$("noButton").addEventListener("click",()=>chooseAccess(false));
$("repeatButton").addEventListener("click",()=>{
  askThenListen(tr("question")+" "+tr("hint"),"answer");
});
$("backLanguage").addEventListener("click",()=>showStep(1));
$("backAccess").addEventListener("click",()=>showStep(2));

$("emailVoice").addEventListener("click",()=>{
  askThenListen(tr("ask"),"email");
});
$("passwordVoice").addEventListener("click",()=>{
  askThenListen("Please say your password.", "password");
});
$("voiceToggle").addEventListener("click",()=>{
  voiceEnabled=!voiceEnabled;
  applyLanguage();
  say(voiceEnabled?tr("voiceOn"):tr("voiceOff"));
});
$("readPage").addEventListener("click",()=>{
  voiceEnabled=true;
  applyLanguage();
  const section=currentStep===1?"languageStep":currentStep===2?"accessStep":"loginStep";
  say($(section).innerText);
});
$("fontDown").addEventListener("click",()=>document.body.classList.remove("big"));
$("fontUp").addEventListener("click",()=>document.body.classList.add("big"));
$("contrast").addEventListener("click",()=>document.body.classList.toggle("contrast"));
$("showPassword").addEventListener("change",()=>{
  $("password").type=$("showPassword").checked?"text":"password";
});

$("loginForm").addEventListener("submit",e=>{
  e.preventDefault();
  // Demo UI only: connect this form to your secure backend for real login.
  $("loginMessage").textContent=
    "Login UI ready. Connect a secure backend to authenticate users.";
  say($("loginMessage").textContent);
});

applyLanguage();

if(localStorage.getItem("vc_visual_assistance")==="yes"){
  voiceEnabled=true;
  applyLanguage();
  showStep(3);
  $("status").textContent="Voice assistance enabled. Press Speak email to grant microphone access.";
}else{
  showStep(1);
}
</script>
</body>
</html>
