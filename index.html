
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalCare</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    min-height: 100vh;
    background: url("ui.jpeg") center/cover fixed no-repeat;
    display: flex;
    flex-direction: column;
    color: white;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(
        to right, rgba(0,0,0,.82), rgba(0,0,0,.55)
    );
    z-index: 0;
    pointer-events: none;
}

header, main, footer {
    position: relative;
    z-index: 1;
}

header {
    padding: 20px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    background: rgba(0,0,0,.2);
}

.logo {
    color: #00e6ac;
    font-size: 23px;
    font-weight: bold;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

nav a, .links a {
    color: white;
    text-decoration: none;
}

nav a:hover, .links a:hover {
    color: #00e6ac;
    text-decoration: underline;
}

main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 30px 16px;
}

.app-name {
    font-size: clamp(36px, 6vw, 48px);
    font-weight: bold;
    margin-bottom: 10px;
}

.tagline {
    font-size: 18px;
    margin-bottom: 25px;
    color: #e5e7eb;
}

.login-box {
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(15px);
    padding: 30px;
    width: min(360px, 95vw);
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

.login-box input[type="email"],
.login-box input[type="password"],
.login-box input[type="text"] {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid transparent;
    border-radius: 8px;
    font-size: 16px;
    color: #222;
    background: white;
}

.primary-btn, .language-card button {
    width: 100%;
    padding: 12px;
    background: #00b894;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 12px;
}

button:hover {
    filter: brightness(1.1);
}

button:focus-visible, a:focus-visible, select:focus-visible,
input:focus-visible {
    outline: 3px solid #ffe66d;
    outline-offset: 3px;
}

.links {
    margin-top: 18px;
    line-height: 2;
}

.accessibility-tools {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
}

.accessibility-tools button {
    background: #202b32;
    color: white;
    border: 1px solid white;
    border-radius: 7px;
    padding: 9px 12px;
    cursor: pointer;
}

.show-password {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    margin: 8px 0;
    text-align: left;
}

.show-password input {
    width: 18px;
    height: 18px;
}

.msg {
    margin-top: 12px;
    overflow-wrap: anywhere;
}

.msg.error { color: #ffcccc; }
.msg.success { color: #aaffdf; }

footer {
    text-align: center;
    padding: 15px;
    background: rgba(0,0,0,.7);
}

footer span { color: #00e6ac; }

/* Language selection screen */
.language-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(0,0,0,.94);
    overflow-y: auto;
}

.language-screen[hidden] { display: none; }

.language-card {
    width: min(420px, 100%);
    background: white;
    color: #222;
    padding: 28px;
    border-radius: 16px;
    text-align: center;
}

.language-card h2 { margin-bottom: 12px; }
.language-card p { margin-bottom: 20px; line-height: 1.5; }

.language-card label {
    display: block;
    text-align: left;
    margin-bottom: 8px;
}

.language-card select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #888;
    font-size: 16px;
    background: white;
    color: #222;
}

.high-contrast {
    background: black !important;
}

.high-contrast header,
.high-contrast main,
.high-contrast footer {
    background-color: black;
    color: white;
}

.high-contrast .login-box {
    background: black;
    border: 2px solid white;
}

@media (max-width: 600px) {
    header {
        justify-content: center;
        text-align: center;
    }

    nav { justify-content: center; gap: 14px; }
    .login-box { padding: 24px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo" data-i18n="sysTitle">
        Health Monitoring System
    </div>

    <nav aria-label="Main navigation">
        <a href="home.html" data-i18n="home">Home</a>
        <a href="about.html" data-i18n="about">About Us</a>
        <a href="contact.html" data-i18n="contact">Contact Us</a>
    </nav>
</header>

<!-- First-time language selection -->
<section id="languageScreen" class="language-screen"
         aria-labelledby="languageHeading">
    <div class="language-card">
        <h2 id="languageHeading">Choose Your Language</h2>
        <p id="languageDescription">
            Select your preferred language to continue.
        </p>

        <label for="langSelect" id="languageLabel">
            Select Language
        </label>

        <select id="langSelect">
            <option value="en">English</option>
            <option value="ta">தமிழ் — Tamil</option>
            <option value="hi">हिन्दी — Hindi</option>
            <option value="te">తెలుగు — Telugu</option>
            <option value="kn">ಕನ್ನಡ — Kannada</option>
            <option value="ml">മലയാളം — Malayalam</option>
            <option value="bn">বাংলা — Bengali</option>
            <option value="mr">मराठी — Marathi</option>
            <option value="gu">ગુજરાતી — Gujarati</option>
            <option value="pa">ਪੰਜਾਬੀ — Punjabi</option>
            <option value="or">ଓଡ଼ିଆ — Odia</option>
            <option value="ur">اردو — Urdu</option>
        </select>

        <button type="button" id="continueBtn">Continue</button>
    </div>
</section>

<main>
    <div class="accessibility-tools">
        <button type="button" id="readBtn" data-i18n="read">
            🔊 Read Page
        </button>
        <button type="button" id="fontMinus" data-i18n="fontMinus">
            A-
        </button>
        <button type="button" id="fontPlus" data-i18n="fontPlus">
            A+
        </button>
        <button type="button" id="contrastBtn" data-i18n="contrast">
            High Contrast
        </button>
    </div>

    <div class="app-name">VitalCare</div>

    <div class="tagline" data-i18n="tagline">
        Smart Health Monitoring for a Better Tomorrow
    </div>

    <div class="login-box">
        <form id="loginForm">
            <label for="email" data-i18n="emailLabel">Email</label>
            <input type="email" id="email"
                   data-i18n-placeholder="emailHint"
                   placeholder="Enter Email" autocomplete="username"
                   required>

            <label for="password" data-i18n="passwordLabel">
                Password
            </label>
            <input type="password" id="password"
                   data-i18n-placeholder="passwordHint"
                   placeholder="Enter Password"
                   autocomplete="current-password" required>

            <label class="show-password">
                <input type="checkbox" id="showPw">
                <span data-i18n="showPw">Show Password</span>
            </label>

            <button class="primary-btn" type="submit"
                    data-i18n="login">Login</button>

            <div id="formMsg" class="msg" role="status"
                 aria-live="polite"></div>

            <div class="links">
                <a href="signup.html" data-i18n="signup">Sign Up</a>
                |
                <a href="forgot.html" data-i18n="forgot">
                    Forgot Password?
                </a>
            </div>
        </form>
    </div>
</main>

<footer>
    © 2026 <span>VitalCare</span>
    <span data-i18n="footer">Health Monitoring System | All Rights Reserved</span>
</footer>

const speechLang = {
    en:"en-IN", ta:"ta-IN", hi:"hi-IN", te:"te-IN",
    kn:"kn-IN", ml:"ml-IN", bn:"bn-IN", mr:"mr-IN",
    gu:"gu-IN", pa:"pa-IN", or:"or-IN", ur:"ur-PK"
};

const langSelect = document.getElementById("langSelect");
const languageScreen = document.getElementById("languageScreen");
const msgBox = document.getElementById("formMsg");

let currentLanguage = "en";

function t(key) {
    return translations[currentLanguage]?.[key]
        || translations.en[key]
        || key;
}

function applyLanguage(code) {
    if (!translations[code]) code = "en";

    currentLanguage = code;

    document.documentElement.lang = code;
    document.documentElement.dir = code === "ur" ? "rtl" : "ltr";

    document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        element.textContent = t(key);
    });

    document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {
        element.placeholder = t(element.dataset.i18nPlaceholder);
    });

    document.getElementById("languageHeading").textContent = t("choose");
    document.getElementById("languageDescription").textContent = t("description");
    document.getElementById("languageLabel").textContent = t("language");
    document.getElementById("continueBtn").textContent = t("continue");

    langSelect.value = code;

    msgBox.textContent = "";
    msgBox.className = "msg";

    try {
        localStorage.setItem("vc_lang", code);
    } catch (error) {
        console.warn("Could not save language preference.");
    }
}

function speak(text) {
    if (!("speechSynthesis" in window)) {
        alert("Voice output is not supported by this browser.");
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = speechLang[currentLanguage] || "en-IN";

    const voices = window.speechSynthesis.getVoices();
    const voice = voices.find(v =>
        v.lang.toLowerCase() === utterance.lang.toLowerCase()
    );

    if (voice) utterance.voice = voice;

    window.speechSynthesis.speak(utterance);
}

/* First visit asks for language. Later visits use saved language. */
let savedLanguage = null;

try {
    savedLanguage = localStorage.getItem("vc_lang");
} catch (error) {}

if (savedLanguage && translations[savedLanguage]) {
    applyLanguage(savedLanguage);
    languageScreen.hidden = true;
} else {
    applyLanguage("en");
    languageScreen.hidden = false;
}

/* Preview translations when the user changes the dropdown. */
langSelect.addEventListener("change", () => {
    applyLanguage(langSelect.value);
});

/* Continue saves the selection and opens the login screen. */
document.getElementById("continueBtn").addEventListener("click", () => {
    applyLanguage(langSelect.value);
    languageScreen.hidden = true;
    document.getElementById("email").focus();
    speak(t("tagline"));
});

/* Show/hide password. */
document.getElementById("showPw").addEventListener("change", event => {
    document.getElementById("password").type =
        event.target.checked ? "text" : "password";
});

/* Font-size controls. */
let fontScale = 100;

try {
    fontScale = parseInt(localStorage.getItem("vc_font"), 10) || 100;
} catch (error) {}

function setFont(value) {
    fontScale = Math.max(80, Math.min(160, value));
    document.documentElement.style.fontSize = fontScale + "%";

    try {
        localStorage.setItem("vc_font", String(fontScale));
    } catch (error) {}
}

setFont(fontScale);

document.getElementById("fontPlus").onclick =
    () => setFont(fontScale + 10);

document.getElementById("fontMinus").onclick =
    () => setFont(fontScale - 10);

/* High contrast preference. */
try {
    if (localStorage.getItem("vc_contrast") === "1") {
        document.body.classList.add("high-contrast");
    }
} catch (error) {}

document.getElementById("contrastBtn").onclick = () => {
    const enabled = document.body.classList.toggle("high-contrast");

    try {
        localStorage.setItem("vc_contrast", enabled ? "1" : "0");
    } catch (error) {}
};

/* Read important page content aloud. */
document.getElementById("readBtn").onclick = () => {
    speak([
        t("sysTitle"), "VitalCare", t("tagline"),
        t("emailLabel"), t("passwordLabel"), t("login"),
        t("signup"), t("forgot")
    ].join(". "));
};

function showMessage(message, type) {
    msgBox.textContent = (type === "error" ? "⚠ " : "✓ ") + message;
    msgBox.className = "msg " + type;
    speak(message);
}

/*
 DEMO LOGIN ONLY:
 This retains the original project's localStorage-based login.
 It is not secure authentication for real users.
*/
document.getElementById("loginForm").addEventListener("submit", event => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    let storedEmail = null;
    let storedPassword = null;

    try {
        storedEmail = localStorage.getItem("userEmail");
        storedPassword = localStorage.getItem("userPassword");
    } catch (error) {}

    if (!storedEmail || !storedPassword) {
        showMessage(t("newUser"), "error");

        setTimeout(() => {
            window.location.href = "signup.html";
        }, 2500);

        return;
    }

    if (email === storedEmail && password === storedPassword) {
        showMessage(t("success"), "success");

        setTimeout(() => {
            window.location.href = "patient.html";
        }, 1200);
    } else {
        showMessage(t("invalid"), "error");
    }
});
</script>
