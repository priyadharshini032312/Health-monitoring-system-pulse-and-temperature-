<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Result - VitalCare</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f4f8fb;min-height:100vh;display:flex;flex-direction:column}
header{background:#0f2027;color:white;padding:15px 50px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h2{color:#00e6ac}
nav a{color:white;text-decoration:none;margin-left:25px;transition:0.3s}
nav a:hover{color:#00e6ac}
.hero{text-align:center;padding:40px 20px;background:linear-gradient(to right,#00b894,#00cec9);color:white}
.hero h1{font-size:34px}
.main{flex:1;display:flex;justify-content:center;padding:40px 20px}
.result-card{background:white;width:480px;max-width:100%;padding:35px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.1);text-align:center;height:fit-content}
.param{color:#555;font-size:18px;margin-bottom:12px}
.status{display:inline-block;padding:10px 22px;border-radius:25px;font-size:22px;font-weight:bold;margin-bottom:18px}
.status.normal{background:#e6f9f3;color:#00785c;border:1px solid #00b894}
.status.warn{background:#fff4e0;color:#a35a00;border:1px solid #fdcb6e}
.status.danger{background:#ffeaea;color:#b71c1c;border:1px solid #d63031}
.message{color:#555;line-height:1.7;margin-bottom:25px}
.buttons a{display:inline-block;padding:12px 22px;margin:6px;border-radius:8px;color:white;text-decoration:none;background:#00b894}
.buttons a.blue{background:#0984e3}
.buttons a.red{background:#d63031}
.note{font-size:12px;color:#777;margin-top:20px}
footer{text-align:center;padding:20px;background:#0f2027;color:white}
</style>
</head>
<body>

<header>
    <h2>VitalCare</h2>
    <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="index.html">Logout</a>
    </nav>
</header>

<section class="hero"><h1>Health Check Result</h1></section>

<section class="main"><div class="result-card" id="card"></div></section>

<footer>© 2026 VitalCare Health Monitoring System | All Rights Reserved</footer>

<script>
const card = document.getElementById("card");
let data = null;
try { data = JSON.parse(localStorage.getItem("lastHealthResult")); } catch(e) {}

if (data) {
    card.innerHTML =
        '<div class="param">' + data.parameter + '</div>' +
        '<div class="status ' + data.level + '">' + data.status + '</div>' +
        '<p class="message">' + data.message + '</p>' +
        '<div class="buttons">' +
            '<a href="parameter.html">Check Another Parameter</a>' +
            '<a class="blue" href="home.html">Go to Home</a>' +
            (data.level === "danger" ? '<a class="red" href="emergency.html">🚨 Emergency Help</a>' : '') +
        '</div>' +
        '<p class="note">For awareness only. This is not a medical diagnosis.</p>';
} else {
    card.innerHTML =
        '<p class="message">No result found. Please check a parameter first.</p>' +
        '<div class="buttons"><a href="parameter.html">Select Parameter</a></div>';
}
</script>

</body>
</html>
